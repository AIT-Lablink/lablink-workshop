# Hub host: MQTT broker, config server, FMU simulator, datapoint bridge,
# plotters, Universal API, network display and the web entry point.
#
# Before the first start:
#   cp .env.example .env            # set HUB_HTTP_PORT if it is not 8080
#   edit network.yaml               # hub_ip, hub_http_port, station addresses
#   python gen_config.py
#
# The station reaches this host on 1883 (MQTT) and 8080 (reverse proxy, which
# serves the config server at /config/get). Port 10101 is not published.

x-lablink-client: &lablink-client
  restart: unless-stopped  # retries until the config server answers
  environment: &lablink-env
    LLCONFIG: http://lablink-config:10101/get?id=
  depends_on: &lablink-deps
    mqtt:
      condition: service_healthy
    lablink-config:
      condition: service_started
  networks:
    - hub

services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # A Windows bind mount is world-writable, which Mosquitto 2 refuses to load.
    # The copy script has to be a single argument.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cp /mosquitto/config/mosquitto.conf /tmp/mosquitto.conf && chmod 600 /tmp/mosquitto.conf && exec /usr/sbin/mosquitto -c /tmp/mosquitto.conf"
    ports:
      - "1883:1883"
    networks:
      - hub
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  lablink-config:
    image: ait1/lablink-config-server:latest
    restart: unless-stopped
    volumes:
      # Generated by tools/gen_config.py. Must exist before "up", otherwise
      # Docker creates a directory with this name.
      - ./config/hub-config.db:/app/config.db
    # Not published: hub containers use lablink-config:10101, everything else
    # goes through the proxy (/config/ for the UI, /config/get for clients).
    # For local debugging only:  ports: ["127.0.0.1:10101:10101"]
    networks:
      - hub

  dpb:
    <<: *lablink-client
    image: ait1/lablink-datapoint-bridge:latest

  fmusim:
    <<: *lablink-client
    image: ait1/lablink-fmusim:latest
    profiles: ["fmusim"]
    stdin_open: true
    tty: true
    volumes:
      - ./network-sim/fmu:/opt/fmu
    environment:
      <<: *lablink-env
      FMU_DIR: /opt/fmu

  plotter-tsupply:
    <<: *lablink-client
    image: ait1/lablink-plotter:latest
    environment:
      <<: *lablink-env
      PLOT_CONFIG: ait.annex.simpledh.plotter.tsupply.config
      MEMORY_FLAG: -Xmx1024m
      SESSION_NAME: T supply

  plotter-mflow:
    <<: *lablink-client
    image: ait1/lablink-plotter:latest
    environment:
      <<: *lablink-env
      PLOT_CONFIG: ait.annex.simpledh.plotter.mflow.config
      MEMORY_FLAG: -Xmx1024m
      SESSION_NAME: mass flow rate supply

  plotter-tsub:
    <<: *lablink-client
    image: ait1/lablink-plotter:latest
    environment:
      <<: *lablink-env
      PLOT_CONFIG: ait.annex.simpledh.plotter.tsub.config
      MEMORY_FLAG: -Xmx1024m
      SESSION_NAME: T substation

  uapi-client:
    <<: *lablink-client
    image: ait1/lablink-universal-api-client:latest

  network-display:
    build: ./network-display
    image: lablink-workshop/network-display
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://uapi-client:7000
    depends_on:
      uapi-client:
        condition: service_started
    networks:
      - hub

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      # Render the template to /etc/nginx/nginx.conf. Only variables that are
      # set in this environment are substituted, nginx's own $vars stay intact.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./config/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./config/index.html:/usr/share/nginx/html/index.html:ro
      - ./config/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./config/logo.png:/usr/share/nginx/html/logo.png:ro
    ports:
      - "${HUB_HTTP_PORT:-8080}:80"
    depends_on:
      - lablink-config
      - uapi-client
      - network-display
    networks:
      - hub

networks:
  hub:
    driver: bridge
