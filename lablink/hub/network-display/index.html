<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network display</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sweep" aria-hidden="true"></div>

  <header>
    <div class="brand">
      <span class="eyebrow">District heating &middot; live co-simulation</span>
    </div>
    <p id="status">connecting</p>
  </header>

  <main>
    <figure class="panel">
      <div class="panel-meta" aria-hidden="true">
        <span>NET-01 &middot; schematic</span>
        <span>1 plant &middot; 2 substations &middot; 14 sensors</span>
        <span>refresh 1&nbsp;Hz</span>
      </div>

      <svg viewBox="0 26 362 170" role="img" aria-labelledby="diagram-title">
        <title id="diagram-title">District heating network</title>
        <defs>
          <linearGradient id="sup-left-grad" gradientUnits="userSpaceOnUse" x1="41.021111" y1="43.066128" x2="181.25031" y2="43.066128">
            <stop id="sup-left-grad-0" offset="0" stop-color="#b7c0c0"/>
            <stop id="sup-left-grad-1" offset="0.333333" stop-color="#b7c0c0"/>
            <stop id="sup-left-grad-2" offset="0.666667" stop-color="#b7c0c0"/>
            <stop id="sup-left-grad-3" offset="1" stop-color="#b7c0c0"/>
          </linearGradient>
          <linearGradient id="sup-right-grad" gradientUnits="userSpaceOnUse" x1="181.25031" y1="43.066128" x2="321.47952" y2="43.066128">
            <stop id="sup-right-grad-0" offset="0" stop-color="#b7c0c0"/>
            <stop id="sup-right-grad-1" offset="0.333333" stop-color="#b7c0c0"/>
            <stop id="sup-right-grad-2" offset="0.666667" stop-color="#b7c0c0"/>
            <stop id="sup-right-grad-3" offset="1" stop-color="#b7c0c0"/>
          </linearGradient>
          <linearGradient id="ret-left-grad" gradientUnits="userSpaceOnUse" x1="41.021111" y1="178.864022" x2="181.25031" y2="178.864022">
            <stop id="ret-left-grad-0" offset="0" stop-color="#b7c0c0"/>
            <stop id="ret-left-grad-1" offset="0.333333" stop-color="#b7c0c0"/>
            <stop id="ret-left-grad-2" offset="0.666667" stop-color="#b7c0c0"/>
            <stop id="ret-left-grad-3" offset="1" stop-color="#b7c0c0"/>
          </linearGradient>
          <linearGradient id="ret-right-grad" gradientUnits="userSpaceOnUse" x1="181.25031" y1="178.864022" x2="321.47952" y2="178.864022">
            <stop id="ret-right-grad-0" offset="0" stop-color="#b7c0c0"/>
            <stop id="ret-right-grad-1" offset="0.333333" stop-color="#b7c0c0"/>
            <stop id="ret-right-grad-2" offset="0.666667" stop-color="#b7c0c0"/>
            <stop id="ret-right-grad-3" offset="1" stop-color="#b7c0c0"/>
          </linearGradient>

          <!-- laboratory hardware -->
          <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fbfcfd"/>
            <stop offset="0.08" stop-color="#eef2f6"/>
            <stop offset="1" stop-color="#d9e1e8"/>
          </linearGradient>
          <linearGradient id="flange" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eef2f6"/>
            <stop offset="0.5" stop-color="#a9b7c4"/>
            <stop offset="1" stop-color="#76889a"/>
          </linearGradient>
          <radialGradient id="probe" cx="0.4" cy="0.35" r="0.7">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.6" stop-color="#c3ced9"/>
            <stop offset="1" stop-color="#7f90a2"/>
          </radialGradient>
          <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="20" width="362" height="180">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
            <feComponentTransfer in="blur" result="soft">
              <feFuncA type="linear" slope="0.45"/>
            </feComponentTransfer>
            <feMerge>
              <feMergeNode in="soft"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <pattern id="bench" width="4" height="4" patternUnits="userSpaceOnUse">
            <path d="M 4 0 L 0 0 0 4" fill="none" stroke="#1f5d99" stroke-opacity="0.07" stroke-width="0.25"/>
          </pattern>
        </defs>

        <!-- technical-drawing bench -->
        <rect x="0" y="26" width="362" height="170" fill="url(#bench)"/>

        <!-- pipe jackets (insulated glass-bore tubes) -->
        <g class="jacket" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="jacket-outer" d="M 41.021111,78.459594 V 43.066128 H 321.47952 V 78.459594 M 181.25031,43.066128 V 78.459594"/>
          <path class="jacket-outer" d="M 321.47952,143.470556 V 178.864022 H 41.021111 V 143.470556 M 181.25031,143.470556 V 178.864022"/>
          <path class="jacket-bore" d="M 41.021111,78.459594 V 43.066128 H 321.47952 V 78.459594 M 181.25031,43.066128 V 78.459594"/>
          <path class="jacket-bore" d="M 321.47952,143.470556 V 178.864022 H 41.021111 V 143.470556 M 181.25031,143.470556 V 178.864022"/>
          <path class="jacket-shine" d="M 49,36.6 H 313.5 M 49,172.4 H 313.5"/>
        </g>

        <!-- medium: color = temperature, width = mass flow -->
        <g fill="none" stroke="#b7c0c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
          <line id="sup-riser" x1="41.021111" y1="78.459594" x2="41.021111" y2="43.066128"><title></title></line>
          <line id="sup-left" x1="41.021111" y1="43.066128" x2="181.25031" y2="43.066128"><title></title></line>
          <line id="sup-right" x1="181.25031" y1="43.066128" x2="321.47952" y2="43.066128"><title></title></line>
          <line id="sup-stub1" x1="181.25031" y1="43.066128" x2="181.25031" y2="78.459594"><title></title></line>
          <line id="sup-stub2" x1="321.47952" y1="43.066128" x2="321.47952" y2="78.459594"><title></title></line>
          <line id="ret-riser" x1="41.021111" y1="143.470556" x2="41.021111" y2="178.864022"><title></title></line>
          <line id="ret-left" x1="41.021111" y1="178.864022" x2="181.25031" y2="178.864022"><title></title></line>
          <line id="ret-right" x1="181.25031" y1="178.864022" x2="321.47952" y2="178.864022"><title></title></line>
          <line id="ret-stub1" x1="181.25031" y1="143.470556" x2="181.25031" y2="178.864022"><title></title></line>
          <line id="ret-stub2" x1="321.47952" y1="143.470556" x2="321.47952" y2="178.864022"><title></title></line>
        </g>

        <!-- flow direction tracer -->
        <g class="tracer" fill="none" aria-hidden="true">
          <path d="M 41.021111,78.459594 V 43.066128 H 321.47952 V 78.459594"/>
          <path d="M 181.25031,43.066128 V 78.459594"/>
          <path d="M 321.47952,143.470556 V 178.864022 H 41.021111 V 143.470556"/>
          <path d="M 181.25031,143.470556 V 178.864022"/>
        </g>

        <g class="pipe-label" aria-hidden="true">
          <text x="64.39" y="33">SUPPLY &#9656;</text>
          <text x="64.39" y="191.6">&#9666; RETURN</text>
        </g>

        <!-- equipment -->
        <g id="plant">
          <rect class="housing" x="7.1652594" y="78.459595" width="67.7117" height="64.845596" rx="1.6" ry="1.6"/>
          <path class="housing-rim" d="M 8.6,80.6 H 73.4"/>
          <path class="plant-icon" d="M 14.688781,135.4234 V 84.550058 h 9.314838 v 32.243672 l 15.226175,-15.22618 v 14.86791 l 14.420085,-14.42008 v 13.70356 l 13.837907,-13.83791 v 33.54237 z"/>
          <g class="screws"><circle cx="10.4" cy="81.7" r="0.9"/><circle cx="71.6" cy="81.7" r="0.9"/><circle cx="10.4" cy="140.1" r="0.9"/><circle cx="71.6" cy="140.1" r="0.9"/></g>
        </g>

        <g id="substation-1" transform="translate(13.229206)">
          <rect class="housing" x="134.16525" y="78.459595" width="67.7117" height="64.845596" rx="1.6" ry="1.6"/>
          <path class="housing-rim" d="M 135.6,80.6 H 200.4"/>
          <g class="screws"><circle cx="137.4" cy="81.7" r="0.9"/><circle cx="198.6" cy="81.7" r="0.9"/><circle cx="137.4" cy="140.1" r="0.9"/><circle cx="198.6" cy="140.1" r="0.9"/></g>
          <path id="house-1" class="house" fill="#b7c0c0" d="m 142.58866,135.58876 v -34.91687 l 25.43244,-14.330515 25.01728,14.443725 -0.29291,34.80366 z">
            <title>TSupSub1: no sample</title>
          </path>
        </g>
        <text id="loa-1" class="load" x="181.25031" y="118" text-anchor="middle" fill="#ffffff" font-size="12">
          <title>QLoa1 has no sample yet</title>
          <tspan id="loa-1-value">80 kW</tspan>
        </text>

        <g id="substation-2">
          <rect class="housing" x="287.62366" y="78.459595" width="67.7117" height="64.845596" rx="1.6" ry="1.6"/>
          <path class="housing-rim" d="M 289.1,80.6 H 353.9"/>
          <g class="screws"><circle cx="290.9" cy="81.7" r="0.9"/><circle cx="352.1" cy="81.7" r="0.9"/><circle cx="290.9" cy="140.1" r="0.9"/><circle cx="352.1" cy="140.1" r="0.9"/></g>
          <path id="house-2" class="house" fill="#b7c0c0" d="m 296.04709,135.58876 v -34.91687 l 25.43244,-14.330515 25.01728,14.443725 -0.29291,34.80366 z">
            <title>TSupSub2: no sample</title>
          </path>
          <text id="loa-2" class="load" x="321.47952" y="118" text-anchor="middle" fill="#ffffff" font-size="12">
            <title>QLoa2 has no sample yet</title>
            <tspan id="loa-2-value">80 kW</tspan>
          </text>
        </g>

        <g class="tag" aria-hidden="true">
          <text x="7.4" y="75.4">PLANT</text>
          <text x="147.6" y="75.4">SUBSTATION 1</text>
          <text x="287.9" y="75.4">SUBSTATION 2</text>
        </g>

        <!-- pipe flanges where tubes enter the equipment -->
        <g class="flanges" fill="url(#flange)" aria-hidden="true">
          <rect x="30.8" y="76.2" width="20.4" height="3.2" rx="0.6"/>
          <rect x="171.05" y="76.2" width="20.4" height="3.2" rx="0.6"/>
          <rect x="311.28" y="76.2" width="20.4" height="3.2" rx="0.6"/>
          <rect x="30.8" y="142.5" width="20.4" height="3.2" rx="0.6"/>
          <rect x="171.05" y="142.5" width="20.4" height="3.2" rx="0.6"/>
          <rect x="311.28" y="142.5" width="20.4" height="3.2" rx="0.6"/>
        </g>

        <!-- temperature probes -->
        <g class="probe-ring" fill="url(#probe)" aria-hidden="true">
          <circle cx="41.021111" cy="43.066128" r="6.3"/>
          <circle cx="87.764175" cy="43.066128" r="6.3"/>
          <circle cx="134.50723" cy="43.066128" r="6.3"/>
          <circle cx="181.25031" cy="43.066128" r="6.3"/>
          <circle cx="227.99338" cy="43.066128" r="6.3"/>
          <circle cx="274.73645" cy="43.066128" r="6.3"/>
          <circle cx="321.47952" cy="43.066128" r="6.3"/>
          <circle cx="41.021111" cy="178.864022" r="6.3"/>
          <circle cx="87.764175" cy="178.864022" r="6.3"/>
          <circle cx="134.50723" cy="178.864022" r="6.3"/>
          <circle cx="181.25031" cy="178.864022" r="6.3"/>
          <circle cx="227.99338" cy="178.864022" r="6.3"/>
          <circle cx="274.73645" cy="178.864022" r="6.3"/>
          <circle cx="321.47952" cy="178.864022" r="6.3"/>
        </g>

        <g class="probe">
          <circle id="node-sup-0" cx="41.021111" cy="43.066128" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-sup-1" cx="87.764175" cy="43.066128" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-sup-2" cx="134.50723" cy="43.066128" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-sup-3" cx="181.25031" cy="43.066128" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-sup-4" cx="227.99338" cy="43.066128" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-sup-5" cx="274.73645" cy="43.066128" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-sup-6" cx="321.47952" cy="43.066128" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-ret-0" cx="41.021111" cy="178.864022" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-ret-1" cx="87.764175" cy="178.864022" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-ret-2" cx="134.50723" cy="178.864022" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-ret-3" cx="181.25031" cy="178.864022" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-ret-4" cx="227.99338" cy="178.864022" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-ret-5" cx="274.73645" cy="178.864022" r="4.5655" fill="#b7c0c0"><title></title></circle>
          <circle id="node-ret-6" cx="321.47952" cy="178.864022" r="4.5655" fill="#b7c0c0"><title></title></circle>
        </g>

        <g class="probe-label" text-anchor="middle" aria-hidden="true">
          <text x="41.021111" y="33">S1.1</text>
          <text x="87.764175" y="33">S1.2</text>
          <text x="134.50723" y="33">S1.3</text>
          <text x="181.25031" y="33">S2.1</text>
          <text x="227.99338" y="33">S2.2</text>
          <text x="274.73645" y="33">S2.3</text>
          <text x="321.47952" y="33">S2.4</text>
          <text x="41.021111" y="191.6">R1.1</text>
          <text x="87.764175" y="191.6">R1.2</text>
          <text x="134.50723" y="191.6">R1.3</text>
          <text x="181.25031" y="191.6">R1.4</text>
          <text x="227.99338" y="191.6">R2.2</text>
          <text x="274.73645" y="191.6">R2.3</text>
          <text x="321.47952" y="191.6">R2.4</text>
        </g>
      </svg>

      <figcaption class="legend">
        <div class="legend-item">
          <span class="legend-label">Supply</span>
          <span class="scale">
            <span class="scale-bar supply"></span>
            <span class="scale-ticks"><span>50</span><span>65</span><span>80&nbsp;&deg;C</span></span>
          </span>
        </div>
        <div class="legend-item">
          <span class="legend-label">Return</span>
          <span class="scale">
            <span class="scale-bar return"></span>
            <span class="scale-ticks"><span>20</span><span>26.5</span><span>33&nbsp;&deg;C</span></span>
          </span>
        </div>
        <div class="legend-item">
          <span class="legend-label">Mass flow</span>
          <span class="widths" aria-hidden="true"><i style="height:2px"></i><i style="height:5px"></i><i style="height:9px"></i></span>
          <span class="legend-note">line width</span>
        </div>
        <div class="legend-item">
          <span class="swatch" aria-hidden="true"></span>
          <span class="legend-note">no data</span>
        </div>
      </figcaption>
    </figure>
  </main>
  <script src="app.js"></script>
</body>
</html>
